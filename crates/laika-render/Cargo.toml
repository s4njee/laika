[package]
name = "laika-render"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "laika-render"
path = "src/main.rs"

[dependencies]
image = "0.25"
laika-core = { path = "../laika-core" }
laika-develop = { path = "../laika-develop" }
laika-export = { path = "../laika-export" }
laika-raw = { path = "../laika-raw" }
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
serde_json = "1"
