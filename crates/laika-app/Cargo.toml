[package]
name = "laika-app"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "laika"
path = "src/main.rs"

[dependencies]
laika-core = { path = "../laika-core" }
laika-develop = { path = "../laika-develop" }
laika-export = { path = "../laika-export" }
laika-raw = { path = "../laika-raw" }
gpui-kit = { workspace = true }
gpui-pre = { workspace = true }
gpui-pre-platform = { workspace = true }
smallvec = "1"
image = "0.25"
# Keep source builds self-contained on Windows: ravif's default `asm` feature
# requires a separately installed NASM. Threaded pure-Rust AV1 is portable.
ravif = { version = "0.13", default-features = false, features = ["threading"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }

[build-dependencies]
# Already used by GPUI's Windows manifest; also gives Laika.exe its own icon.
embed-resource = "3"

[dev-dependencies]
