[package]
name = "laika-export"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25"
# Avoid a hidden NASM prerequisite on clean Windows developer machines.
ravif = { version = "0.13", default-features = false, features = ["threading"] }
resvg = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
laika-core = { path = "../laika-core" }
